<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Blog</title>
</head>
<body>
    <h1>Welcome to My Blog</h1>
    {% for post in posts %}
        <div>
            <small>Post Id : {{ post.id}} </small>
            <h2>{{ post.title }}</h2>
            <p>{{ post.description }}</p>
        </div>
        <hr>
    {% empty %}
        <p>No posts available.</p>
    {% endfor %}
</body>
</html>
